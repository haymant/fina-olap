[project]
name = "fina-olap"
version = "0.3.0"
description = "ag-grid Server-Side Row Model OLAP engine over Parquet (S3/GCS/local) powered by DuckDB — with a lean HTTP server, an MCP v2 tool server and a Vercel serverless deployment target"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FinA" }]
keywords = ["ag-grid", "ssrm", "olap", "duckdb", "parquet", "s3", "gcs", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Front-Ends",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "duckdb>=1.1,<2",
    "mcp>=1.6,<2",
    "fastapi>=0.110,<1",
    "pandas>=2.0,<3",
    "pyarrow>=15,<22",
    "pydantic>=2.8,<3",
    "starlette>=0.40,<1",
]

[project.scripts]
fina-olap = "fina_olap.cli:main"
fina-olap-mcp = "fina_olap.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fina_olap"
module-root = "src"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1,<3",
    "httpx>=0.27,<1",
    "mypy>=1.11,<2",
    "pytest>=8.0,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "uvicorn>=0.30,<1",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", ".tmp", "data", "dist", "node_modules", "demo"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true