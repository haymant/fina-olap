name: Publish fina-olap + fina-table

# Publishes the `fina-olap` Python package to TestPyPI/PyPI via Trusted
# Publishers (OIDC, no stored tokens) and the `fina-table` React package to
# npmjs.com via npm's Trusted Publishers with provenance.
#
# Setup required once per repo:
#   - PyPI:  "fina-olap" publishers pointed at this repo + `publish.yml`
#            (environments `testpypi` and `pypi`).
#   - npm:   fina-table package Trusted Publisher -> this repo + `publish.yml`.
# Triggered by publishing a GitHub Release (or manually with workflow_dispatch).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-build-and-test:
    name: Build + Verify fina-olap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install + test
        run: |
          uv sync
          uv run pytest -q
          uv run ruff check src tests api

      - name: Build distributions
        run: uv build

      - name: Upload Distributions
        uses: actions/upload-artifact@v4
        with:
          name: fina-olap-dist
          path: dist/

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: python-build-and-test
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Download Distributions
        uses: actions/download-artifact@v4
        with:
          name: fina-olap-dist
          path: dist/
      - name: Publish to TestPyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always

  publish-to-pypi:
    name: Publish to PyPI
    needs: [publish-to-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/fina-olap
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Download Distributions
        uses: actions/download-artifact@v4
        with:
          name: fina-olap-dist
          path: dist/
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  fina-table-build-and-test:
    name: Build + Verify fina-table
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fina-table
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fina-table/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  publish-to-npm:
    name: Publish fina-table to npmjs
    needs: [fina-table-build-and-test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: fina-table
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Publish to npm (Trusted Publisher, provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

  demo-e2e:
    name: E2E · demo (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install python deps + generate fixture
        run: |
          uv sync
          uv run python -c "from fina_olap.fixture import generate_fixture; generate_fixture()"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fina-table/package-lock.json

      - name: Build fina-table
        working-directory: fina-table
        run: |
          npm ci
          npm run build

      - name: Install demo + Playwright browsers
        working-directory: demo
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        working-directory: demo
        run: npm run test:e2e